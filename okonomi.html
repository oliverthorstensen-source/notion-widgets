<!doctype html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Økonomi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0c0d14; --surface:#15161f; --surface-2:#1d1f2a; --line:#2a2c3a;
    --text:#edeef4; --text-dim:#9497ab; --text-faint:#6b6e82;
    --accent:#8b5cf6;
    --good:#34d399; --warn:#fbbf24; --bad:#f43f5e;
    --font-display:'Oswald',system-ui,sans-serif;
    --font-body:'Manrope',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);
       padding:14px;-webkit-font-smoothing:antialiased;font-size:13px;}

  .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:8px;}
  h2{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.04em;
     text-transform:uppercase;margin:0;color:var(--text-dim);}
  .stamp{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);letter-spacing:.04em;}

  .hero{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:9px;}
  .hero .label{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);
               text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
  .hero .value{font-family:var(--font-mono);font-size:27px;font-weight:700;line-height:1.05;
               font-variant-numeric:tabular-nums;}
  .hero .value small{font-size:12px;color:var(--text-dim);font-weight:500;margin-left:4px;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .cell{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
  .cell .label{font-size:11px;color:var(--text-dim);margin-bottom:3px;}
  .cell .value{font-family:var(--font-mono);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .cell .value small{font-size:10px;color:var(--text-dim);font-weight:500;margin-left:2px;}
  .cell .value.tom{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--text-faint);}
  .cell.neg .value{color:var(--bad);}
  .cell.pos .value{color:var(--good);}

  .bars{display:flex;flex-direction:column;gap:8px;}
  .row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;margin-bottom:4px;}
  .row .name{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .amt{font-family:var(--font-mono);color:var(--text-dim);font-variant-numeric:tabular-nums;flex:none;}
  .track{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden;}
  .fill{height:100%;border-radius:100px;background:var(--accent);}
  .fill.over{background:var(--bad);}
  .fill.nesten{background:var(--warn);}

  .list{display:flex;flex-direction:column;}
  .item{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
        padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .item:last-child{border-bottom:none;}
  .item .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .amt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;flex:none;}
  .item .sub{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);}

  .fotnote{color:var(--text-faint);font-size:11px;line-height:1.45;margin-top:8px;}
  .tom-melding{color:var(--text-faint);font-size:12px;line-height:1.5;
               background:var(--surface);border:1px dashed var(--line);border-radius:9px;padding:11px 13px;}
  .feil{color:var(--bad);font-size:12px;}
</style>
</head>
<body>
  <div class="head">
    <h2 id="tittel">Økonomi</h2>
    <span class="stamp" id="stamp"></span>
  </div>
  <div id="innhold" class="tom-melding">Henter …</div>

<script>
const WORKER = 'https://helse-widgets.oliver-thorstensen.workers.dev/finance-summary';
const panel = (new URLSearchParams(location.search).get('panel') || 'netto').toLowerCase();

const kr = n => Math.round(n).toLocaleString('nb-NO');
const el = id => document.getElementById(id);

// En verdi på 0 kan bety "ingenting registrert" eller "faktisk null". Vi skiller
// på det: er lista tom, sier vi det med ord i stedet for å vise et falskt tall.
function tall(verdi, harData) {
  if (!harData) return '<span class="value tom">ikke lagt inn</span>';
  return `<span class="value">${kr(verdi)} <small>kr</small></span>`;
}

const paneler = {
  netto(d) {
    el('tittel').textContent = 'Netto formue';
    const harNoe = (d.fond || []).length || (d.kontoer || []).length
                 || (d.eiendeler_list || []).length || (d.gjeld || []).length;
    return `
      <div class="hero">
        <div class="label">Netto formue</div>
        <div class="value">${kr(d.netto_formue)} <small>kr</small></div>
      </div>
      <div class="grid">
        <div class="cell"><div class="label">Fond</div>${tall(d.fond_sum, (d.fond || []).length)}</div>
        <div class="cell"><div class="label">Kontoer</div>${tall(d.kontoer_saldo_sum, (d.kontoer || []).length)}</div>
        <div class="cell"><div class="label">Eiendeler</div>${tall(d.eiendeler_sum, (d.eiendeler_list || []).length)}</div>
        <div class="cell neg"><div class="label">Gjeld</div>${tall(d.gjeld_sum, (d.gjeld || []).length)}</div>
      </div>
      ${d.gjeld_utelatt_sum > 0 ? `<div class="fotnote">+ ${kr(d.gjeld_utelatt_sum)} kr fremtidig gjeld står utenfor — merket «utelat» i Gjeld.</div>` : ''}
      ${harNoe ? '' : '<div class="tom-melding" style="margin-top:9px;">Ingenting registrert ennå.</div>'}`;
  },

  maaned(d) {
    el('tittel').textContent = 'Siste 30 dager';
    const s = d.siste30 || {};
    const netto = s.netto || 0;
    return `
      <div class="hero">
        <div class="label">Brukt siste 30 dager</div>
        <div class="value">${kr(s.utgifter || 0)} <small>kr</small></div>
      </div>
      <div class="grid">
        <div class="cell pos"><div class="label">Inn</div>${tall(s.inntekt || 0, true)}</div>
        <div class="cell ${netto < 0 ? 'neg' : 'pos'}"><div class="label">Netto</div>${tall(netto, true)}</div>
        <div class="cell"><div class="label">Abonnementer / mnd</div>${tall(d.abonnementer_mnd_sum, (d.abonnementer || []).length)}</div>
        <div class="cell"><div class="label">Denne måneden</div>${tall(d.mnd_utgifter, true)}</div>
      </div>`;
  },

  fordeling(d) {
    el('tittel').textContent = 'Hvor pengene går';
    const f = ((d.siste30 || {}).fordeling || []).slice(0, 8);
    if (!f.length) return '<div class="tom-melding">Ingen utgifter registrert de siste 30 dagene.</div>';
    const maks = f[0].sum || 1;
    return '<div class="bars">' + f.map(r => `
      <div class="row">
        <div class="top"><span class="name">${r.kategori}</span><span class="amt">${kr(r.sum)} kr</span></div>
        <div class="track"><div class="fill" style="width:${Math.max(2, Math.round(r.sum / maks * 100))}%"></div></div>
      </div>`).join('') + '</div>';
  },

  inntekt(d) {
    el('tittel').textContent = 'Inntekt';
    const i = d.inntekt || {};
    const h = (i.historikk || []).slice().reverse();
    if (!h.length) return '<div class="tom-melding">Ingen inntekt registrert ennå.</div>';
    const maks = Math.max(...h.map(m => m.sum), 1);
    const navn = m => {
      const [aar, mnd] = m.split('-');
      return ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'][Number(mnd) - 1] + ' ' + aar.slice(2);
    };
    const denne = i.denne_maaneden || {};
    const kilder = Object.entries(denne.per_kilde || {});
    return `
      <div class="hero">
        <div class="label">Inn denne måneden</div>
        <div class="value">${kr(denne.sum || 0)} <small>kr</small></div>
      </div>
      ${kilder.length ? `<div class="list">${kilder.map(([k, v]) =>
        `<div class="item"><span class="name">${k}</span><span class="amt">${kr(v)} <span class="sub">kr</span></span></div>`).join('')}</div>` : ''}
      <div class="bars" style="margin-top:11px;">${h.map(m => `
        <div class="row">
          <div class="top"><span class="name">${navn(m.maaned)}</span><span class="amt">${m.sum ? kr(m.sum) + ' kr' : '–'}</span></div>
          <div class="track"><div class="fill" style="width:${Math.max(1, Math.round(m.sum / maks * 100))}%"></div></div>
        </div>`).join('')}</div>
      <div class="fotnote">Lånekassen og lønn. Spleis med venner teller ikke — det er penger du får tilbake.${
        i.semester_holdt_utenfor ? ` Semesterutbetalinger på ${kr(i.semester_holdt_utenfor)} kr er holdt utenfor; de går til studieavgiften.` : ''}</div>`;
  },

  plan(d) {
    el('tittel').textContent = 'Månedsplan';
    const i = d.inntekt || {};
    const faste = i.faste_utgifter || [];
    const spar = i.sparefordeling || [];
    if (!i.grunnlag) return '<div class="tom-melding">Ingen inntekt registrert å planlegge med.</div>';
    const restKlasse = i.rest < 0 ? 'neg' : 'pos';
    return `
      <div class="grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="cell"><div class="label">Inn</div>${tall(i.grunnlag, true)}</div>
        <div class="cell neg"><div class="label">Faste</div>${tall(i.faste_sum, true)}</div>
        <div class="cell ${restKlasse}"><div class="label">Til fordeling</div>${tall(i.rest, true)}</div>
      </div>
      ${faste.length ? `<div class="list" style="margin-top:10px;">${faste.map(f =>
        `<div class="item"><span class="name">${f.kategori}</span><span class="amt">${kr(f.belop)} <span class="sub">kr</span></span></div>`).join('')}</div>` : ''}
      ${spar.length ? `
        <div class="group" style="margin-top:12px;">
          <div class="bars">${spar.map(s => `
            <div class="row">
              <div class="top"><span class="name">${s.konto}<span class="sub"> ${s.andel} %</span></span><span class="amt">${kr(s.belop)} kr</span></div>
              <div class="track"><div class="fill" style="width:${Math.min(100, s.andel)}%"></div></div>
            </div>`).join('')}</div>
        </div>
        ${i.andel_sum !== 100 ? `<div class="fotnote">Prosentene summerer til ${i.andel_sum} %, ikke 100. ${i.andel_sum < 100 ? 'Resten blir stående ufordelt.' : 'Du fordeler mer enn du har.'}</div>` : ''}`
      : '<div class="fotnote">Ingen kontoer har fått «Andel av rest (%)». Sett prosenter i Kontoer-databasen for å se fordelingen her.</div>'}
      <div class="fotnote">Grunnlag: ${i.grunnlag_kilde}.</div>`;
  },

  mat(d) {
    el('tittel').textContent = 'Hva maten går til';
    const f = ((d.siste30 || {}).mat_fordeling || []).slice(0, 8);
    if (!f.length) return '<div class="tom-melding">Ingen matkjøp de siste 30 dagene.</div>';
    const maks = f[0].sum || 1;
    const uspes = f.find(r => r.gruppe === 'Uspesifisert');
    return '<div class="bars">' + f.map(r => `
      <div class="row">
        <div class="top"><span class="name">${r.gruppe}</span><span class="amt">${kr(r.sum)} kr</span></div>
        <div class="track"><div class="fill" style="width:${Math.max(2, Math.round(r.sum / maks * 100))}%"></div></div>
      </div>`).join('') + '</div>'
      + (uspes ? '<div class="fotnote">«Uspesifisert» er handler uten kvittering — banken ser bare totalen. Ta bilde av kvitteringen for å dele den opp.</div>' : '');
  },

  budsjett(d) {
    el('tittel').textContent = 'Budsjett';
    const b = d.budsjetter || [];
    if (!b.length) return '<div class="tom-melding">Ingen kategorier har fått budsjett. Sett «Andel av inntekt (%)» eller «Månedsbudsjett (kr)» i Kategorier.</div>';
    const i = d.inntekt || {};
    return '<div class="bars">' + b.map(r => {
      const pst = r.budsjett > 0 ? r.brukt / r.budsjett * 100 : 0;
      const klasse = pst > 100 ? 'over' : (pst > 80 ? 'nesten' : '');
      const merke = r.andel ? `<span class="sub"> ${r.andel} %</span>` : '';
      return `
      <div class="row">
        <div class="top"><span class="name">${r.kategori}${merke}</span><span class="amt">${kr(r.brukt)} / ${kr(r.budsjett)} kr</span></div>
        <div class="track"><div class="fill ${klasse}" style="width:${Math.min(100, Math.round(pst))}%"></div></div>
      </div>`;
    }).join('') + '</div>'
      + (i.grunnlag ? `<div class="fotnote">Prosentbudsjettene regnes av ${kr(i.grunnlag)} kr — ${i.grunnlag_kilde}. Kategorier med fast kronebeløp følger ikke inntekten.</div>` : '');
  },

  fond(d) {
    el('tittel').textContent = 'Fond';
    const f = d.fond || [];
    if (!f.length) return '<div class="tom-melding">Ingen fond registrert.</div>';
    return `
      <div class="hero">
        <div class="label">Samlet verdi</div>
        <div class="value">${kr(d.fond_sum)} <small>kr</small></div>
      </div>
      <div class="list">` + f.map(x => `
        <div class="item">
          <span class="name">${x.navn}</span>
          <span class="amt">${kr(x.verdi)} <span class="sub">kr</span></span>
        </div>`).join('') + '</div>';
  },
};

// Notion holder rammen i live i bakgrunnen, så en endring i databasen ville
// ellers ikke vises før du lastet hele siden på nytt. Vi henter på nytt når
// fanen blir synlig igjen, og hvert femte minutt mens den står fremme.
let hentesNa = false;

function last() {
  if (hentesNa) return;
  hentesNa = true;
  fetch(WORKER + '?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(d => {
      const bygg = paneler[panel];
      if (!bygg) {
        // Før viste et ukjent panelnavn netto-panelet i stillhet, og da så det
        // ut som samme widget lå to steder. Nå sier den fra i stedet.
        el('tittel').textContent = 'Ukjent panel';
        el('innhold').className = 'tom-melding';
        el('innhold').innerHTML =
          `Panelet «${panel}» finnes ikke i denne filen. Har du lastet opp nyeste okonomi.html?`
          + `<br><br>Tilgjengelige: ${Object.keys(paneler).join(', ')}.`;
        return;
      }
      el('innhold').className = '';
      el('innhold').innerHTML = bygg(d);
      const t = new Date(d.generated_at);
      el('stamp').textContent = isNaN(t) ? '' :
        t.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
    })
    .catch(e => {
      el('innhold').className = 'tom-melding';
      el('innhold').innerHTML = `<span class="feil">Fikk ikke kontakt med Workeren.</span><br>${e.message}`;
    })
    .finally(() => { hentesNa = false; });
}

last();
document.addEventListener('visibilitychange', () => { if (!document.hidden) last(); });
window.addEventListener('focus', last);
setInterval(() => { if (!document.hidden) last(); }, 300000);
document.querySelector('.head').addEventListener('click', last);
document.querySelector('.head').style.cursor = 'pointer';
document.querySelector('.head').title = 'Klikk for å hente på nytt';
</script>
</body>
</html>
