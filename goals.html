<!doctype html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Måltabell</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0c0d14; --surface:#15161f; --line:#2a2c3a;
    --text:#edeef4; --text-dim:#9497ab;
    --accent:#8b5cf6; --accent-soft:#8b5cf61a;
    --accent2:#ff6a3d; --accent2-soft:#ff6a3d1a;
    --font-display:'Oswald',system-ui,sans-serif;
    --font-body:'Manrope',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:16px;-webkit-font-smoothing:antialiased;}
  h2{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em;margin:0 0 3px;}
  .hint{color:var(--text-dim);font-size:12px;margin-bottom:12px;line-height:1.5;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;padding:2px 8px;border-radius:100px;margin-left:6px;}
  .tag.beregnet{color:var(--accent);background:var(--accent-soft);border:1px solid #8b5cf644;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-dim);font-weight:500;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);font-family:var(--font-mono);}
  tr:last-child td{border-bottom:none;}
  td.dist{font-family:var(--font-body);color:var(--text-dim);}
  .goal-row{background:var(--accent2-soft);}
  .goal-row td{color:#fff;}
  .overflow{overflow-x:auto;}
</style>
</head>
<body>
  <h2>Hva kreves for ulike 10K-mål <span class="tag beregnet">ren matematikk</span></h2>
  <div class="hint">Jevnt tempo hele veien — ingen negativ/positiv splitting tatt med.</div>
  <div class="overflow">
    <table>
      <thead><tr><th>Måltid, 10K</th><th>Tempo/km</th><th>Hver 1K-splitt</th><th>5K-passering</th></tr></thead>
      <tbody id="goalTable"></tbody>
    </table>
  </div>
  <script>
    function fmtTime(totalSeconds){
      totalSeconds = Math.round(totalSeconds);
      const m = Math.floor(totalSeconds/60);
      const s = totalSeconds%60;
      return `${m}:${String(s).padStart(2,'0')}`;
    }
    function fmtPace(secondsPerKm){
      const m = Math.floor(secondsPerKm/60);
      const s = Math.round(secondsPerKm%60);
      return `${m}:${String(s).padStart(2,'0')}/km`;
    }
    const tbody = document.getElementById('goalTable');
    const goals = [35, 37.5, 40, 42.5, 45];
    goals.forEach(min => {
      const totalSeconds = min * 60;
      const pacePerKm = totalSeconds / 10;
      const kmSplit = fmtPace(pacePerKm);
      const fiveKPassing = fmtTime(pacePerKm * 5);
      const tr = document.createElement('tr');
      if (min === 40) tr.className = 'goal-row';
      tr.innerHTML = `<td class="dist">${min % 1 === 0 ? min : min.toFixed(1)} min${min===40 ? ' — MÅL' : ''}</td><td>${kmSplit}</td><td>${kmSplit}</td><td>${fiveKPassing}</td>`;
      tbody.appendChild(tr);
    });
  </script>
</body>
</html>
