<!doctype html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace-kalkulator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0c0d14; --surface:#15161f; --surface-2:#1d1f2a; --line:#2a2c3a;
    --text:#edeef4; --text-dim:#9497ab;
    --accent:#8b5cf6; --accent-soft:#8b5cf61a;
    --warn:#fbbf24; --warn-soft:#fbbf241a;
    --font-display:'Oswald',system-ui,sans-serif;
    --font-body:'Manrope',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:16px;-webkit-font-smoothing:antialiased;}
  h2{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em;margin:0 0 3px;}
  .hint{color:var(--text-dim);font-size:12px;margin-bottom:14px;line-height:1.5;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;padding:2px 8px;border-radius:100px;margin-left:6px;}
  .tag.anslag{color:var(--warn);background:var(--warn-soft);border:1px solid #fbbf2444;}
  .field-row{display:flex;gap:10px;margin-bottom:12px;}
  .field{flex:1;}
  .field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-family:var(--font-mono);letter-spacing:.03em;}
  input[type=number],input[type=text]{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    font-family:var(--font-mono);font-size:15px;padding:9px 11px;border-radius:8px;
  }
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{
    width:100%;background:var(--accent);color:#0c0d14;border:none;border-radius:8px;
    font-family:var(--font-body);font-weight:700;font-size:13.5px;padding:10px 14px;cursor:pointer;margin-bottom:14px;
  }
  button:hover{background:#a481f9;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-dim);font-weight:500;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid var(--line);}
  td{padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--font-mono);}
  tr:last-child td{border-bottom:none;}
  td.dist{font-family:var(--font-body);color:var(--text-dim);}
  .overflow{overflow-x:auto;}
</style>
</head>
<body>
  <h2>Beregn ut fra en ny økt <span class="tag anslag">anslag, Riegel</span></h2>
  <div class="hint">Legg inn distanse og tid fra en løpetur, så regnes tilsvarende tider ut for andre distanser.</div>
  <div class="field-row">
    <div class="field">
      <label for="dist">Distanse (km)</label>
      <input type="number" id="dist" value="5.17" step="0.01" min="0.1">
    </div>
    <div class="field">
      <label for="time">Tid (mm:ss)</label>
      <input type="text" id="time" value="34:26">
    </div>
  </div>
  <button id="calc">Beregn tilsvarende tider</button>
  <div class="overflow">
    <table id="predTable">
      <thead><tr><th>Distanse</th><th>Anslått tid</th><th>Tempo</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    function parseTime(str){
      const parts = str.trim().split(':').map(Number);
      if (parts.some(isNaN)) return null;
      if (parts.length === 2) return parts[0]*60 + parts[1];
      if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
      return null;
    }
    function fmtTime(totalSeconds){
      totalSeconds = Math.round(totalSeconds);
      const h = Math.floor(totalSeconds/3600);
      const m = Math.floor((totalSeconds%3600)/60);
      const s = totalSeconds%60;
      if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      return `${m}:${String(s).padStart(2,'0')}`;
    }
    function fmtPace(secondsPerKm){
      const m = Math.floor(secondsPerKm/60);
      const s = Math.round(secondsPerKm%60);
      return `${m}:${String(s).padStart(2,'0')}/km`;
    }
    const targetDistances = [
      {label:'1 km', km:1},
      {label:'5 km', km:5},
      {label:'10 km', km:10},
      {label:'Halvmaraton', km:21.0975},
    ];
    function riegel(t1, d1, d2){ return t1 * Math.pow(d2/d1, 1.06); }
    function renderPredictions(){
      const d1 = parseFloat(document.getElementById('dist').value);
      const t1 = parseTime(document.getElementById('time').value);
      const tbody = document.querySelector('#predTable tbody');
      tbody.innerHTML = '';
      if (!d1 || !t1){
        tbody.innerHTML = '<tr><td colspan="3" class="dist">Fyll inn gyldig distanse og tid (mm:ss).</td></tr>';
        return;
      }
      targetDistances.forEach(td => {
        const predicted = riegel(t1, d1, td.km);
        const pace = predicted / td.km;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="dist">${td.label}</td><td>${fmtTime(predicted)}</td><td>${fmtPace(pace)}</td>`;
        tbody.appendChild(tr);
      });
    }
    document.getElementById('calc').addEventListener('click', renderPredictions);
    renderPredictions();
  </script>
</body>
</html>
